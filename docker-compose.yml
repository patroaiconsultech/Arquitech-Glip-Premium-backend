services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glip
      POSTGRES_USER: glip
      POSTGRES_PASSWORD: glip
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U glip -d glip"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    ports: ["8081:8080"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn glip.main:app --host 0.0.0.0 --port 8080"

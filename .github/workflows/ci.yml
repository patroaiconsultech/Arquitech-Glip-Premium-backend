name: glip-backend-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Verify release contract
        run: python scripts/verify_release_contract.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.test.lock.txt
      - run: python scripts/check_runtime_lock.py
      - run: python -m compileall -q src tests scripts
      - run: pytest --color=no -ra
      - name: Verify packaged source contract
        run: |
          rm -rf /tmp/glip-source
          mkdir -p /tmp/glip-source
          git archive --format=tar HEAD | tar -xf - -C /tmp/glip-source
          python scripts/verify_release_contract.py --root /tmp/glip-source
      - name: Capture release provenance
        run: |
          python - <<'PY'
          import json, os, subprocess
          payload = {
              "commit_sha": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
              "tree_sha": subprocess.check_output(["git","rev-parse","HEAD^{tree}"], text=True).strip(),
              "github_run_id": os.getenv("GITHUB_RUN_ID"),
              "github_run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"),
          }
          open("RELEASE_PROVENANCE.json","w",encoding="utf-8").write(json.dumps(payload, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: glip-backend-release-provenance
          path: RELEASE_PROVENANCE.json
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: glip
          POSTGRES_PASSWORD: glip_ci_only
          POSTGRES_DB: glip
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U glip -d glip"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONPATH: src
      GLIP_ENVIRONMENT: test
      GLIP_DATABASE_URL: postgresql+psycopg://glip:glip_ci_only@localhost:5432/glip
      GLIP_AUTH_MODE: dev_headers
      GLIP_ORKIO_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - name: Verify release contract
        run: python scripts/verify_release_contract.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.test.lock.txt
      - run: alembic upgrade head
      - run: python scripts/postgres_ci_smoke.py
      - run: alembic downgrade 0002_glip_orkio_contract_v10
      - run: alembic upgrade head

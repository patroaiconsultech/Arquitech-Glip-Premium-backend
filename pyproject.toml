[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glip-cognitive-backend"
version = "1.0.0rc8"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1","pydantic>=2.9,<3","pydantic-settings>=2.5,<3",
  "uvicorn>=0.30,<1","sqlalchemy>=2.0,<3","alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4","httpx>=0.27,<1",
  "boto3>=1.43,<2","defusedxml>=0.7,<1","openpyxl>=3.1,<4","pypdf>=5,<7",
  "python-pptx>=1,<2","reportlab>=4.4,<5","python-multipart>=0.0.20,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
bim-worker = ["ifcopenshell==0.8.5"]
geometry-worker = ["ezdxf==1.4.4","trimesh==4.11.1","numpy==2.3.5"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
